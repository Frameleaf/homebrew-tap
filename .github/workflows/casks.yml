name: Casks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # ponytail: on schedule/dispatch, follow the latest Frameleaf Desktop release so the cask never lags.
      - name: Follow the latest release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view -R Frameleaf/frameleaf-desktop --json tagName -q .tagName | sed 's/^v//')
          sha=$(gh release download "v$version" -R Frameleaf/frameleaf-desktop -p SHA256SUMS -O - \
            | awk -v f="Frameleaf_${version}_aarch64.dmg" '$2 == f { print $1 }')
          test -n "$sha" || { echo "No checksum for Frameleaf_${version}_aarch64.dmg"; exit 1; }
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/frameleaf.rb
          git diff --stat
      - name: Style, audit, install and uninstall
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap frameleaf/tap "$GITHUB_WORKSPACE"
          brew trust --tap frameleaf/tap
          for cask in Casks/*.rb; do
            name="frameleaf/tap/$(basename "$cask" .rb)"
            brew style --cask "$name"
            brew audit --cask --online --strict "$name"
            brew install --cask "$name"
            brew uninstall --cask "$name"
          done
      - name: Commit the update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Update frameleaf to $(sed -n 's/^  version "\(.*\)"/\1/p' Casks/frameleaf.rb)"
          git push origin HEAD:refs/heads/main
